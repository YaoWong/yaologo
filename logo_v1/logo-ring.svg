<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Arc shading: dark near center, lighter at outer stroke edge -->
    <radialGradient id="arc-shade" cx="512" cy="512" r="260"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0e0e0e"/>
      <stop offset="65%"  stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2e2e2e"/>
    </radialGradient>

    <!-- Ray gradients: dark at hub, lighter toward tip -->
    <linearGradient id="ray-shade-270" x1="512" y1="512" x2="512" y2="852"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
    <linearGradient id="ray-shade-030" x1="512" y1="512" x2="806.45" y2="342"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
    <linearGradient id="ray-shade-150" x1="512" y1="512" x2="217.55" y2="342"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>

    <!-- Hub gradient: softer radial with gentler falloff for smooth blend -->
    <radialGradient id="hub-shade" cx="512" cy="512" r="34"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0a0a0a"/>
      <stop offset="50%"  stop-color="#111111"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!--
    Geometry (refined):
      Ring center (512,512), radius 250, stroke-width 19
      One shared circular ring split by 3 equal gaps
      Dash pattern: 102° arc, 18° gap, repeated 3 times
      Ring rotated -21° so gap midpoints align at 270°, 30°, 150° (math)
      Rays: curved-tapered paths from hub edge (r=34) to r=340
        half-width: 6.5 at hub entry → 12.0 at full flare → 3.5 at tip
        Cubic Bézier flare over 48px from hub for smooth transition
  -->

  <!-- Tapered rays (drawn first, behind arcs) -->

  <!-- Ray at 270° — straight down -->
  <path d="M 518.50,546.00 C 521.36,560.40 523.45,578.64 524.00,594.00 L 515.50,852.00 L 508.50,852.00 L 500.00,594.00 C 500.55,578.64 502.64,560.40 505.50,546.00 Z"
        fill="url(#ray-shade-270)"/>

  <!-- Ray at 30° — upper right -->
  <path d="M 538.19,489.37 C 549.24,479.69 563.99,468.76 577.01,460.61 L 804.70,338.97 L 808.20,345.03 L 589.01,481.39 C 575.44,488.60 558.60,495.91 544.69,500.63 Z"
        fill="url(#ray-shade-030)"/>

  <!-- Ray at 150° — upper left -->
  <path d="M 479.31,500.63 C 465.40,495.91 448.56,488.60 434.99,481.39 L 215.80,345.03 L 219.30,338.97 L 446.99,460.61 C 460.01,468.76 474.76,479.69 485.81,489.37 Z"
        fill="url(#ray-shade-150)"/>

  <!-- One shared ring, broken into 3 equal arc segments -->
  <circle
    cx="512"
    cy="512"
    r="250"
    fill="none"
    stroke="url(#arc-shade)"
    stroke-width="19"
    stroke-linecap="round"
    stroke-dasharray="445.06 78.54"
    transform="rotate(-21 512 512)"
  />

  <!-- Center hub (drawn on top, covers ray bases with soft glow) -->
  <circle cx="512" cy="512" r="34" fill="url(#hub-shade)"/>
</svg>
