<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yaokit logo review</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f3f3f3;
        color: #111;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, #ffffff 0%, #f3f3f3 58%, #e8e8e8 100%);
      }

      .panel {
        width: min(92vw, 980px);
        padding: 32px;
        border: 1px solid #d9d9d9;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(14px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: #4f4f4f;
        line-height: 1.6;
      }

      .stage {
        margin-top: 24px;
        padding: 32px;
        border-radius: 24px;
        background:
          linear-gradient(180deg, #ffffff 0%, #f8f8f8 100%);
        border: 1px solid #ececec;
        display: grid;
        place-items: center;
      }

      img {
        width: min(68vw, 520px);
        aspect-ratio: 1;
        display: block;
      }

      .meta {
        margin-top: 20px;
        display: grid;
        gap: 8px;
        font-size: 14px;
        color: #5a5a5a;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        padding: 2px 6px;
        border-radius: 999px;
        background: #efefef;
        color: #1d1d1d;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>yaokit logo proposal</h1>
      <p>
        三段等长圆环 + 三条从中心穿过空隙的射线，整体保持黑白灰层次，方便先审形态与重心。
      </p>
      <section class="stage">
        <img src="./logo-ring.svg" alt="yaokit monochrome logo proposal" />
      </section>
      <div class="meta">
        <div>主稿：<code>tmp/logo-ring.svg</code></div>
        <div>预览页：<code>tmp/logo-ring-review.html</code></div>
      </div>
    </main>
  </body>
  </html>
