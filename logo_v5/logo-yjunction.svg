<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="arc-shade" cx="512" cy="512" r="260"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0e0e0e"/>
      <stop offset="65%"  stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2e2e2e"/>
    </radialGradient>

    <radialGradient id="y-shade" cx="512" cy="512" r="340"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#222222"/>
      <stop offset="40%"  stop-color="#252525"/>
      <stop offset="100%" stop-color="#2e2e2a"/>
    </radialGradient>

    <radialGradient id="center-fade" cx="512" cy="512" r="27"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="rgb(255,255,255)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="rgb(255,255,255)" stop-opacity="1"/>
    </radialGradient>

    <mask id="center-soften">
      <rect width="1024" height="1024" fill="white"/>
      <circle cx="512" cy="512" r="27" fill="url(#center-fade)"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!--
    Y-junction convergence core - v5
    Ring: center (512,512), r=250, stroke-width 22, dasharray 445.06 78.54, rotated -21deg
    Core: stroke-based junction (sw=48, round linejoin + linecap)
      + filled branch bodies (hw=13 lower / hw=15 upper) with 7px tips
      + ray roots are centered on the same three axes as the stroked junction
      + soft center lightening mask (34% opacity at center, r=27)
    Gradients: arc-shade (ring), y-shade (lighter at center)
  -->

  <g mask="url(#center-soften)">
    <!-- Center junction: preserved from v4 -->
    <path d="M 512.00 590.00 L 512 512 L 577.82 474.00 M 577.82 474.00 L 512 512 L 446.18 474.00 M 446.18 474.00 L 512 512 L 512.00 590.00"
          stroke="url(#y-shade)"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- Branch bodies: narrower roots, unchanged tips, centered on the junction axes -->
    <path d="M 525.00 590.00 C 521.83 677.33 518.67 764.67 515.50 852.00 A 3.5 3.5 0 0 1 508.50 852.00 C 505.33 764.67 502.17 677.33 499.00 590.00 Z" fill="url(#y-shade)"/>
    <path d="M 570.32 461.01 C 648.44 420.33 726.57 379.65 804.70 338.97 A 3.5 3.5 0 0 1 808.20 345.03 C 733.91 392.35 659.61 439.67 585.32 486.99 Z" fill="url(#y-shade)"/>
    <path d="M 438.68 486.99 C 364.39 439.67 290.09 392.35 215.80 345.03 A 3.5 3.5 0 0 1 219.30 338.97 C 297.43 379.65 375.56 420.33 453.68 461.01 Z" fill="url(#y-shade)"/>
  </g>

  <!-- Outer ring: preserved from v3/v4 -->
  <circle
    cx="512"
    cy="512"
    r="250"
    fill="none"
    stroke="url(#arc-shade)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-dasharray="445.06 78.54"
    transform="rotate(-21 512 512)"
  />
</svg>
