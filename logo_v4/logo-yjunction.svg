<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="arc-shade" cx="512" cy="512" r="260"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0e0e0e"/>
      <stop offset="65%"  stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2e2e2e"/>
    </radialGradient>

    <radialGradient id="y-shade" cx="512" cy="512" r="340"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#222222"/>
      <stop offset="40%"  stop-color="#252525"/>
      <stop offset="100%" stop-color="#2e2e2a"/>
    </radialGradient>

    <radialGradient id="center-fade" cx="512" cy="512" r="27"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="rgb(255,255,255)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="rgb(255,255,255)" stop-opacity="1"/>
    </radialGradient>

    <mask id="center-soften">
      <rect width="1024" height="1024" fill="white"/>
      <circle cx="512" cy="512" r="27" fill="url(#center-fade)"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!--
    Y-junction convergence core - v4
    Ring: center (512,512), r=250, stroke-width 22, dasharray 445.06 78.54, rotated -21deg
    Core: stroke-based junction (sw=48, round linejoin + linecap)
      + filled branch bodies (hw=16 lower / hw=18 upper) with 7px tips
      + thinner roots reduce center density while preserving the v3 outer ring weight
      + soft center lightening mask (34% opacity at center, r=27)
    Gradients: arc-shade (ring), y-shade (lighter at center)
  -->

  <g mask="url(#center-soften)">
    <!-- Center junction: three lines through center with round linejoin -->
    <path d="M 512.00 590.00 L 512 512 L 577.82 474.00 M 577.82 474.00 L 512 512 L 446.18 474.00 M 446.18 474.00 L 512 512 L 512.00 590.00"
          stroke="url(#y-shade)"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- Branch bodies: thinner roots for a lighter, more balanced center -->
    <path d="M 528.00 590.00 C 523.83 677.33 519.67 764.67 515.50 852.00 A 3.5 3.5 0 0 1 508.50 852.00 C 504.33 764.67 500.17 677.33 496.00 590.00 Z" fill="url(#y-shade)"/>
    <path d="M 562.23 461.59 C 643.05 420.72 723.88 379.84 804.70 338.97 A 3.5 3.5 0 0 1 808.20 345.03 C 732.25 396.25 656.29 447.46 580.34 498.68 Z" fill="url(#y-shade)"/>
    <path d="M 443.66 498.68 C 367.71 447.46 291.75 396.25 215.80 345.03 A 3.5 3.5 0 0 1 219.30 338.97 C 300.12 379.84 380.95 420.72 461.77 461.59 Z" fill="url(#y-shade)"/>
  </g>

  <!-- Outer ring: preserved from v3 -->
  <circle
    cx="512"
    cy="512"
    r="250"
    fill="none"
    stroke="url(#arc-shade)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-dasharray="445.06 78.54"
    transform="rotate(-21 512 512)"
  />
</svg>
