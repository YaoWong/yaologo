<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="arc-shade" cx="512" cy="512" r="260"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0e0e0e"/>
      <stop offset="65%"  stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2e2e2e"/>
    </radialGradient>

    <radialGradient id="y-shade" cx="512" cy="512" r="340"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#222222"/>
      <stop offset="38%"  stop-color="#252525"/>
      <stop offset="100%" stop-color="#2e2e2a"/>
    </radialGradient>

    <radialGradient id="center-fade" cx="512" cy="512" r="28"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="rgb(255,255,255)" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="rgb(255,255,255)" stop-opacity="1"/>
    </radialGradient>

    <mask id="center-soften">
      <rect width="1024" height="1024" fill="white"/>
      <circle cx="512" cy="512" r="28" fill="url(#center-fade)"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!--
    Y-junction convergence core - v3
    Ring: center (512,512), r=250, stroke-width 22, dasharray 445.06 78.54, rotated -21deg
    Core: stroke-based junction (sw=54, round linejoin + linecap)
      + filled branch bodies (hw=19 lower / hw=21 upper) with a calmer taper to 7px tips
      + upper branch body starts at d=62 for a longer overlap into the rounded core
      + soft center lightening mask (40% opacity at center, r=28)
    Gradients: arc-shade (ring), y-shade (lighter at center)
  -->

  <g mask="url(#center-soften)">
    <!-- Center junction: three lines through center with round linejoin -->
    <path d="M 512.00 588.00 L 512 512 L 576.09 475.00 M 576.09 475.00 L 512 512 L 447.91 475.00 M 447.91 475.00 L 512 512 L 512.00 588.00"
          stroke="url(#y-shade)"
          stroke-width="54"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- Branch bodies: slightly thinner roots with linear taper -->
    <path d="M 531.00 588.00 C 525.83 676.00 520.67 764.00 515.50 852.00 A 3.5 3.5 0 0 1 508.50 852.00 C 503.33 764.00 498.17 676.00 493.00 588.00 Z" fill="url(#y-shade)"/>
    <path d="M 555.19 462.81 C 638.36 421.53 721.53 380.25 804.70 338.97 A 3.5 3.5 0 0 1 808.20 345.03 C 730.86 396.42 653.53 447.80 576.19 499.19 Z" fill="url(#y-shade)"/>
    <path d="M 447.81 499.19 C 370.47 447.80 293.14 396.42 215.80 345.03 A 3.5 3.5 0 0 1 219.30 338.97 C 302.47 380.25 385.64 421.53 468.81 462.81 Z" fill="url(#y-shade)"/>
  </g>

  <!-- Outer ring: slightly thicker than v2 -->
  <circle
    cx="512"
    cy="512"
    r="250"
    fill="none"
    stroke="url(#arc-shade)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-dasharray="445.06 78.54"
    transform="rotate(-21 512 512)"
  />
</svg>
